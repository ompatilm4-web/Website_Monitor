<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Website Monitor{% endblock %}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 80px;
            background:#111827;
            box-shadow:0px 2px 10px rgba(0,0,0,0.4);
            flex-wrap:wrap;
            gap:15px;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:#38bdf8;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:30px;
        }

        nav ul li a{
            text-decoration:none;
            color:white;
            transition:0.3s;
            padding-bottom:4px;
        }

        nav ul li a:hover{
            color:#38bdf8;
        }

        nav ul li a.active{
            color:#38bdf8;
            border-bottom:2px solid #38bdf8;
        }

        main{
            flex:1;
            padding:60px 20px;
        }

        h1.page-title{
            text-align:center;
            margin-bottom:10px;
            font-size:38px;
        }

        p.page-subtitle{
            text-align:center;
            color:#94a3b8;
            margin-bottom:40px;
        }

        .table-wrap{
            max-width:900px;
            margin:0 auto;
            background:#1e293b;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:16px 20px;
            text-align:center;
        }

        th{
            background:#111827;
            color:#38bdf8;
            font-size:14px;
            text-transform:uppercase;
            letter-spacing:0.5px;
        }

        td{
            color:#e2e8f0;
            border-top:1px solid #334155;
        }

        tr:hover td{
            background:#243044;
        }

        .badge{
            display:inline-block;
            padding:6px 16px;
            border-radius:999px;
            font-size:13px;
            font-weight:bold;
            letter-spacing:0.5px;
        }

        .badge-up{
            background:rgba(34,197,94,0.15);
            color:#4ade80;
            border:1px solid #4ade80;
        }

        .badge-down{
            background:rgba(239,68,68,0.15);
            color:#f87171;
            border:1px solid #f87171;
        }

        .empty-state{
            text-align:center;
            padding:40px;
            color:#94a3b8;
        }

        .actions{
            max-width:900px;
            margin:30px auto 0;
            display:flex;
            justify-content:center;
            gap:20px;
        }

        .btn{
            padding:12px 26px;
            border:none;
            border-radius:8px;
            text-decoration:none;
            font-size:16px;
            transition:0.3s;
            cursor:pointer;
        }

        .btn-primary{
            background:#38bdf8;
            color:black;
            font-weight:bold;
        }

        .btn-primary:hover{
            background:#0ea5e9;
        }

        .btn-secondary{
            border:2px solid #38bdf8;
            color:#38bdf8;
            background:transparent;
        }

        .btn-secondary:hover{
            background:#38bdf8;
            color:black;
        }

        footer{
            text-align:center;
            padding:25px;
            background:#020617;
            color:#94a3b8;
        }

        @media (max-width:700px){
            nav{ padding:20px 30px; }
            th, td{ padding:12px 8px; font-size:14px; }
        }

    </style>

    {% block extra_head %}{% endblock %}

</head>

<body>

    <nav>

        <div class="logo">Website Monitor</div>

        <ul>
            <li><a href="/" class="{% if active == 'home' %}active{% endif %}">Home</a></li>
            <li><a href="/monitor" class="{% if active == 'monitor' %}active{% endif %}">Monitor</a></li>
            <li><a href="/report" class="{% if active == 'report' %}active{% endif %}">Reports</a></li>
        </ul>

    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        © 2026 Website Monitor Project | Built with Flask & Python
    </footer>

</body>

</html>
