<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        table{
            width:85%;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        th, td{
            border:1px solid #ccc;
            padding:15px;
            text-align:center;
        }

        th{
            background:#28a745;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        .back{
            display:block;
            width:150px;
            margin:30px auto;
            text-align:center;
            text-decoration:none;
            background:#28a745;
            color:white;
            padding:12px;
            border-radius:5px;
        }

    </style>

</head>

<body>

    <h1>Website Reports</h1>

    <table>

        <tr>
            <th>Website</th>
            <th>Response Time</th>
            <th>Status</th>
        </tr>

        {% for item in reports %}

        <tr>

            <td>{{ item.website }}</td>
            <td>{{ item.response_time }}</td>
            <td>{{ item.status }}</td>

        </tr>

        {% endfor %}

    </table>

    <a href="/" class="back">
        Back Home
    </a>

</body>

</html>
